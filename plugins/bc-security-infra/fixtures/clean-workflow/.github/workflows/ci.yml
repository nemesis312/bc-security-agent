# The SHAs below are synthetic (repeated pattern), not real commits.
name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@0123456789abcdef0123456789abcdef01234567 # v4.1.1 (synthetic SHA)
        with:
          persist-credentials: false
      - uses: actions/setup-node@0123456789abcdef0123456789abcdef01234567 # v4.0.2 (synthetic SHA)
        with:
          node-version: 24
      - env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: echo "Testing PR: $PR_TITLE"
      - run: npm ci
      - run: npm test
