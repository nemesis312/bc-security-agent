# bc-security fixture: intentionally fake credential. The image digest is synthetic.
services:
  db:
    image: postgres:16.2-alpine@sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
    environment:
      POSTGRES_PASSWORD: fixture-not-a-real-password-1234
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
volumes:
  dbdata:
