name: False positive
description: A rule reported a finding on code that is safe.
title: "false positive: "
labels: ["false-positive"]
body:
  - type: markdown
    attributes:
      value: Redact secrets and private details from the snippet before pasting it.
  - type: input
    id: rule-id
    attributes:
      label: Rule ID
      placeholder: BCS-CODE-001
    validations:
      required: true
  - type: textarea
    id: snippet
    attributes:
      label: Code snippet
      description: The smallest snippet that triggers the finding.
      render: text
    validations:
      required: true
  - type: textarea
    id: why-safe
    attributes:
      label: Why it is safe
      description: The control or context that makes this code safe.
    validations:
      required: true
  - type: input
    id: plugin-version
    attributes:
      label: Plugin version
      placeholder: "0.1.0"
    validations:
      required: true
